name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Job 1: Validate Version Tag
  # ==========================================
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    
    steps:
      - name: Extract version from tag
        id: extract-version
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version extracted: $VERSION"
      
      - name: Verify version format
        run: |
          if [[ ! "${{ steps.extract-version.outputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag format. Expected format: vX.Y.Z"
            exit 1
          fi

  # ==========================================
  # Job 2: Test and Build
  # ==========================================
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: validate-tag
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test -- --ci --coverage
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      
      - name: Build application
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 7

  # ==========================================
  # Job 3: Security Audit
  # ==========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run npm audit
        run: npm audit --audit-level=high
      
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          hide-progress: true
      
      - name: Show results
        run: cat trivy-results.txt

  # ==========================================
  # Job 4: Generate Changelog
  # ==========================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [validate-tag, test-build]
    
    outputs:
      changelog: ${{ steps.generate.outputs.changelog }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Generate changelog
        id: generate
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^)
          CHANGELOG=$(cat <<EOF
          ## Changes since ${PREVIOUS_TAG:-initial release}
          
          ### Features
          - See commits for feature additions
          
          ### Bug Fixes
          - See commits for bug fixes
          
          ### Security
          - See commits for security patches
          
          EOF
          )
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ==========================================
  # Job 5: Docker Image Build
  # ==========================================
  docker-release:
    name: Build & Push Release Image
    runs-on: ubuntu-latest
    needs: [validate-tag, security-audit]
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 6: Create GitHub Release
  # ==========================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Auto-generated release for ${{ github.ref_name }}
            
            See below for recent changes.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Job 7: Notify Deployment Teams
  # ==========================================
  notify-deployment:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [create-release, docker-release]
    if: success()
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deployment notification sent"
          # Add your deployment automation here
          # Example: curl -X POST https://deployment-service/deploy \
          #   -H "Authorization: Bearer ${TOKEN}" \
          #   -d '{
          #     "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}",
          #     "environment": "production",
          #     "tag": "${{ github.ref_name }}"
          #   }'
