name: Security Scan

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # ==========================================
  # Job 1: Dependency Vulnerability Scan (Trivy)
  # ==========================================
  trivy-dependencies:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner for dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-deps-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          hide-progress: true
          skip-files: |
            node_modules/**/*
      
      - name: Upload Trivy dependency results
        uses: actions/upload-artifact@v3
        with:
          name: trivy-dependency-results
          path: trivy-deps-results.txt
          retention-days: 30

  # ==========================================
  # Job 2: Container Image Security Scan
  # ==========================================
  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build Docker image for scanning
        run: docker build -t app-for-scanning .
      
      - name: Run Trivy on container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-for-scanning'
          format: 'table'
          output: 'trivy-image-results.txt'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      
      - name: Upload container scan results
        uses: actions/upload-artifact@v3
        with:
          name: trivy-container-results
          path: trivy-image-results.txt
          retention-days: 30

  # ==========================================
  # Job 3: Code Quality Security Checks
  # ==========================================
  security-lint:
    name: Security Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Run security-focused ESLint rules
        run: npm run lint
      
      - name: Run secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ==========================================
  # Job 4: License Compliance Check
  # ==========================================
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install licenses-checker
        run: npm install -g license-checker
      
      - name: Check for restricted licenses
        run: license-checker --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;Unlicense' --production --summary
      
      - name: Generate license report
        run: license-checker --production --out licenses-report.txt || echo "Warning: License check found issues"
      
      - name: Upload license report
        uses: actions/upload-artifact@v3
        with:
          name: license-report
          path: licenses-report.txt
          retention-days: 30

  # ==========================================
  # Job 5: SAST - Static Application Security Testing
  # ==========================================
  sast-scan:
    name: SAST Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install semgrep
        run: pip install semgrep
      
      - name: Run Semgrep security checks
        run: semgrep --config=p/react --config=p/js-security-audit --error .
      
      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ==========================================
  # Job 6: Secrets Detection Scan
  # ==========================================
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy secrets detection
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-secrets-results.txt'
          scan-configs: true
          scan-secret: true
          ignorefile: .trivyignore
      
      - name: Upload secrets detection results
        uses: actions/upload-artifact@v3
        with:
          name: trivy-secrets-results
          path: trivy-secrets-results.txt
          retention-days: 30

  # ==========================================
  # Job 7: Supply Chain Analysis
  # ==========================================
  supply-chain-analysis:
    name: Supply Chain Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      
      - name: Generate dependency graph
        run: npm list --all > dependency-tree.txt
      
      - name: Upload dependency tree
        uses: actions/upload-artifact@v3
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 7

  # ==========================================
  # Job 8: Send Security Report
  # ==========================================
  notify-security-team:
    name: Notify Security Team
    runs-on: ubuntu-latest
    needs: [trivy-dependencies, trivy-container, security-lint, license-compliance, sast-scan, secrets-detection]
    if: failure() || always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Consolidate security findings
        run: |
          echo "=== SECURITY SCAN REPORT ===" >> consolidated-report.txt
          echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> consolidated-report.txt
          echo "" >> consolidated-report.txt
          
          if [ -f trivy-dependency-results/ ]; then
            echo "### Dependency Scan Results ###" >> consolidated-report.txt
            cat trivy-dependency-results/*.txt >> consolidated-report.txt 2>/dev/null || true
            echo "" >> consolidated-report.txt
          fi
          
          if [ -f trivy-container-results/ ]; then
            echo "### Container Scan Results ###" >> consolidated-report.txt
            cat trivy-container-results/*.txt >> consolidated-report.txt 2>/dev/null || true
            echo "" >> consolidated-report.txt
          fi
          
          if [ -f trivy-secrets-results/ ]; then
            echo "### Secrets Detection Results ###" >> consolidated-report.txt
            cat trivy-secrets-results/*.txt >> consolidated-report.txt 2>/dev/null || true
            echo "" >> consolidated-report.txt
          fi
      
      - name: Upload consolidated report
        uses: actions/upload-artifact@v3
        with:
          name: consolidated-security-report
          path: consolidated-report.txt
          retention-days: 30
      
      - name: Notify Slack (optional)
        if: failure()
        run: |
          echo "Security scan failed. Please review the results in the artifacts."
          # Add your notification logic here
          # Example: curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Security scan failed! 🚨"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
